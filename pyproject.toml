[project]
name = "band-video-studio"
version = "0.1.0"
description = "Analyze and auto-edit band rehearsal videos: song detection, highlights, fun-moment spotting, and multicam-style crop editing."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2.0",
    "anthropic>=0.50",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
lyrics = [
    "faster-whisper>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
